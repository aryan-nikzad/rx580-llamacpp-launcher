"-m $MODELS_DIR/Nail/Nail-Qwen3.6-35B-A3B-UD-Q5_K_XL.gguf
-fit on
--host 127.0.0.1
--port 8080
--alias qwen35b
-c 196000
-ctk q8_0
-ctv q8_0
