#!/bin/bash

# ==========================================================
# Model configuration for aio-llama-launcher.sh
#
# Variables available from launcher:
# $MODELS_DIR
#
# Add models by adding:
#   MODEL_NAMES entry
#   MODEL_ARGS entry
#   MODEL_ENV entry
#   MODEL_FAMILY entry   <-- NEW: which sampling preset table to use
#   MODEL_MODES entry    <-- NEW: comma-separated modes offered for this model
#
# MODEL_FAMILY values (must match a case in get_mode_flags() in the launcher):
#   qwen36           - Qwen3.6-35B-A3B derivatives (Nail, Hermes full/visual).
#                      Numbers are straight from Qwen/Qwen3.6-35B-A3B's own
#                      "Best Practices" section on HF - the Nail/Hermes merge
#                      cards don't publish their own overrides, so the base
#                      model's numbers are the correct fallback.
#   qwen36-compact    - same family, small 32K "prompt generator" builds
#   ornith            - ornith-ai/Ornith-1.5-35B-A3B. NOTE: despite the
#                      "Ornit" name in this file looking like a Nail typo,
#                      Ornith is a genuinely different model/finetune - its
#                      model card (and every quant mirror of it) recommends
#                      its own numbers, distinct from Qwen3.6/Nail/Hermes.
#   gptoss            - GPT-OSS-20B (llama.cpp's official recommendation)
#
# MODEL_MODES values (any subset/order of): code,general,instruct,creative
#   - "creative" is NOT an officially documented preset for any of these
#     models - it's a community-style heuristic (nudge temp/presence_penalty
#     up from "general"), included because it was asked for. Treat it as a
#     starting point to tune, not a sourced number like the others.
#   - If a model lists only 1 mode, the launcher applies it silently.
#   - If a model lists 2+ modes, the launcher asks which one to use at launch time.
# ==========================================================


MODEL_NAMES=(

"Ornit Q5KXL 196K"
"Nail Q5KXL 196K"
"Nail Q5KXL 180K Visual"
"Hermes APEX 196K"
"Hermes APEX 180K Visual"
"Hermes APEX Compact 32K Prompt Generator"
"Hermes APEX Compact 32K Prompt Generator + Visual"
"GPT-OSS 20B FP16"

)


# ==========================================================
# llama-server arguments
# ==========================================================

MODEL_ARGS=(


# ----------------------------------------------------------
# 1) Ornit Q5KXL 196K
# ----------------------------------------------------------

"-m $MODELS_DIR/Ornith/Unsloth-Ornith-1.5-35B-A3B-UD-Q5_K_XL.gguf
-fit on
--host 127.0.0.1
--port 8080
-c 196000
-ctk q8_0
-ctv q8_0
-ngl 99999
--load-mode none
-ts 0.85/1.15/1.15/1.15"


# ----------------------------------------------------------
# 2) Nail Q5KXL 196K
# ----------------------------------------------------------

"-m $MODELS_DIR/Nail/Nail-Qwen3.6-35B-A3B-UD-Q5_K_XL.gguf
-fit on
--host 127.0.0.1
--port 8080
-c 196000
-ctk q8_0
-ctv q8_0
-ngl 99999
--load-mode none
-ts 0.85/1.15/1.15/1.15"



# ----------------------------------------------------------
# 3) Nail Q5KXL 180K Visual
# ----------------------------------------------------------

"-m $MODELS_DIR/Nail/Nail-Qwen3.6-35B-A3B-UD-Q5_K_XL.gguf
-fit on
--host 127.0.0.1
--port 8080
-c 180000
-ctk q8_0
-ctv q8_0
-ngl 99999
--load-mode none
-ts 0.8/1.15/1.15/1.15
--mmproj $MODELS_DIR/Nail/mmproj-F16.gguf"



# ----------------------------------------------------------
# 4) Hermes Q5KXL 196K
# ----------------------------------------------------------

"-m $MODELS_DIR/Hermes/Hermes3.6-35B-A3B-Uncensored-Genesis-V9-MTP-APEX.gguf
-fit on
--host 127.0.0.1
--port 8080
-c 196000
-ctk q8_0
-ctv q8_0
-ngl 99999
--load-mode none
-ts 0.85/1.15/1.15/1.15"



# ----------------------------------------------------------
# 5) Hermes Q5KXL 180K Visual
# ----------------------------------------------------------

"-m $MODELS_DIR/Hermes/Hermes3.6-35B-A3B-Uncensored-Genesis-V9-MTP-APEX.gguf
-fit on
--host 127.0.0.1
--port 8080
-c 180000
-ctk q8_0
-ctv q8_0
-ngl 99999
--load-mode none
-ts 0.8/1.15/1.15/1.15
--mmproj $MODELS_DIR/Hermes/mmproj-F16.gguf"



# ----------------------------------------------------------
# 6) Hermes Compact Q3KXL 32K Prompt Generator
# ----------------------------------------------------------

"-m $MODELS_DIR/Hermes/Hermes3.6-35B-A3B-Uncensored-Genesis-V9-APEX-Compact.gguf
-ngl 999
--host 127.0.0.1
--port 8080
-ctk q8_0
-ctv q8_0
-c 32768 --load-mode none -fit on
--device Vulkan0,Vulkan1,Vulkan2
-ts 1.1,1.5,0.4"





# ----------------------------------------------------------
# 7) Hermes Compact Q3KXL 32K Prompt Generator + Visual
# ----------------------------------------------------------

"-m $MODELS_DIR/Hermes/Hermes3.6-35B-A3B-Uncensored-Genesis-V9-APEX-Compact.gguf
-ngl 999
--host 127.0.0.1
--port 8080
-ctk q8_0
-ctv q8_0
-c 32768
--device Vulkan0,Vulkan1,Vulkan2
-ts 0.85,1.6,0.65 --load-mode none -fit on
--mmproj $MODELS_DIR/Hermes/mmproj-F16.gguf"


# ----------------------------------------------------------
# 8) GPT-OSS FP16
# ----------------------------------------------------------

"-m $MODELS_DIR/GPT-OSS-20B/gpt-oss-20b-F16.gguf
-fit on
--host 127.0.0.1
--port 8080
-ctk q8_0
-ctv q8_0
-ngl 99999
--load-mode none
-ts 0.85/1.15/1.15/1.15"

)


# ==========================================================
# Per-model environment variables
# ==========================================================

MODEL_ENV=(


# 1
""



# 2
""



# 3
""



# 4
""



# 5
""



# 6
"GGML_VK_VISIBLE_DEVICES=0,1,2"



# 7
"GGML_VK_VISIBLE_DEVICES=0,1,2"

# 8
""

)


# ==========================================================
# Sampling family per model (drives which preset table
# get_mode_flags() in the launcher pulls from)
# ==========================================================

MODEL_FAMILY=(

"ornith"            # 1 Ornit == ornith-ai/Ornith-1.5-35B-A3B
"qwen36"            # 2 Nail Q5KXL 196K
"qwen36"            # 3 Nail Q5KXL 180K Visual
"qwen36"            # 4 Hermes APEX 196K
"qwen36"            # 5 Hermes APEX 180K Visual
"qwen36-compact"    # 6 Hermes Compact Prompt Generator
"qwen36-compact"    # 7 Hermes Compact Prompt Generator + Visual
"gptoss"            # 8 GPT-OSS 20B FP16

)


# ==========================================================
# Modes offered per model.
#   code / general / instruct are sourced from each model's own card.
#   creative is an unsourced heuristic add-on (see note above) - only
#   offered on the Nail/Hermes models since they're the ones actually
#   used for roleplay/creative-writing style work.
# ==========================================================

MODEL_MODES=(

"code,general"                       # 1 Ornit / Ornith-1.5-35B-A3B (only 2 modes documented)
"code,general,instruct,creative"     # 2 Nail Q5KXL 196K
"code,general,instruct,creative"     # 3 Nail Q5KXL 180K Visual
"code,general,instruct,creative"     # 4 Hermes APEX 196K
"code,general,instruct,creative"     # 5 Hermes APEX 180K Visual
"code,general"                       # 6 Hermes Compact Prompt Generator (narrow task, keep it simple)
"code,general"                       # 7 Hermes Compact Prompt Generator + Visual
"code,general"                       # 8 GPT-OSS 20B FP16 (no per-task official split, see below)

)


# ==========================================================
# Sampling flags per family:mode. This is what the launcher's
# get_mode_flags() looks up - the actual --temp/--top-p/--top-k/etc.
# values live here, not in the launcher script.
#
# Sources (checked against the actual model cards, not guessed):
#
#  - qwen36 (Nail, Hermes): straight from Qwen/Qwen3.6-35B-A3B's own
#    "Best Practices" section on Hugging Face. Nail/Hermes are
#    Uncensored-Genesis merges built on this base and their own
#    cards don't publish overrides, so the base model's numbers are
#    the right fallback.
#      code     -> "thinking mode, precise coding (e.g. WebDev)"
#      general  -> "thinking mode, general tasks"
#      instruct -> official "non-thinking" mode
#      creative -> NOT an official Qwen preset. Heuristic: nudge
#                  temp + presence_penalty up from "general" for
#                  longer-form / roleplay-style output. Treat as a
#                  starting point to tune, not a sourced number.
#
#  - qwen36-compact: same base model/numbers, just kept to 2 modes
#    since these builds are used for a narrow task (prompt gen).
#
#  - ornith: ornith-ai/Ornith-1.5-35B-A3B. This is a DIFFERENT model
#    from Nail/Hermes (own finetune, own weights), confirmed via its
#    model card and independently by quant mirrors (e.g. AtomicChat's
#    GGUF card explicitly warns llama.cpp does not apply the upstream
#    defaults - you must set them yourself):
#      code    -> temp=0.6, top_p=0.95, top_k=20 (the model's one
#                 documented default - it's already coding-tuned)
#      general -> temp=1.0, top_p=1.0 (the higher-temp setting
#                 Ornith's own Terminal-Bench/agentic evals used)
#
#  - gptoss: llama.cpp's official gpt-oss guide states the
#    recommended setting is exactly `--temp 1.0 --top-p 1.0`
#    (OpenAI didn't publish a per-task split for this model).
#      general -> the official 1.0/1.0 setting
#      code    -> NOT official. Common community practice is a
#                 lower temp for more deterministic completions -
#                 included as a starting point, not a sourced number.
#
# Requires bash 4+ (associative arrays) - standard on any modern
# Linux distro.
# ==========================================================

declare -A MODE_FLAGS

MODE_FLAGS["qwen36:code"]="--temp 0.6 --top-p 0.95 --top-k 20 --min-p 0.0 --repeat-penalty 1.0 --presence-penalty 0.0"
MODE_FLAGS["qwen36:general"]="--temp 1.0 --top-p 0.95 --top-k 20 --min-p 0.0 --repeat-penalty 1.0 --presence-penalty 1.5"
MODE_FLAGS["qwen36:instruct"]="--temp 0.7 --top-p 0.8 --top-k 20 --min-p 0.0 --repeat-penalty 1.0 --presence-penalty 1.5"
MODE_FLAGS["qwen36:creative"]="--temp 1.15 --top-p 0.95 --top-k 40 --min-p 0.0 --repeat-penalty 1.0 --presence-penalty 1.8"

MODE_FLAGS["qwen36-compact:code"]="--temp 0.6 --top-p 0.95 --top-k 20 --min-p 0.0 --repeat-penalty 1.0 --presence-penalty 0.0"
MODE_FLAGS["qwen36-compact:general"]="--temp 0.7 --top-p 0.8 --top-k 20 --min-p 0.0 --repeat-penalty 1.0 --presence-penalty 1.5"

MODE_FLAGS["ornith:code"]="--temp 0.6 --top-p 0.95 --top-k 20"
MODE_FLAGS["ornith:general"]="--temp 1.0 --top-p 1.0"

MODE_FLAGS["gptoss:general"]="--temp 1.0 --top-p 1.0"
MODE_FLAGS["gptoss:code"]="--temp 0.3 --top-p 0.9"


# ==========================================================
# Optional descriptions
# ==========================================================

MODEL_DESCRIPTION=(

""

""

""

""

""

""
""

""

)
