#!/bin/bash

# ==========================================================
# Model configuration for aio-llama-launcher.sh
#
# Variables available from launcher:
# $MODELS_DIR
#
# Add models by adding:
#   MODEL_NAMES entry
#   MODEL_ARGS entry
#   MODEL_ENV entry
# ==========================================================


MODEL_NAMES=(

"Nail Q5KXL 196K"
"Nail Q5KXL 180K Visual"
"Hermes Compact Q3KXL 32K Prompt Generator"
"Hermes Compact Q3KXL 64K Visual"
"Hermes APEX Q5KXL 32K"
